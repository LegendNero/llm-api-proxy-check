[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-proxy-check"
version = "0.1.0"
description = "Check integrity of OpenAI-compatible LLM API proxies (fingerprints, SSE, tool calls, risk score)"
requires-python = ">=3.9"

[project.scripts]
llm-api-proxy-check = "llm_api_proxy_check.__main__:main"

[tool.setuptools.packages.find]
include = ["llm_api_proxy_check*"]

[tool.ruff]
target-version = "py39"
line-length = 160

[tool.ruff.lint]
ignore = ["BLE001", "TRY004"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
