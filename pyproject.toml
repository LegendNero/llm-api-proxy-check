[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "0.1.0"
description = "Standard-library relay API integrity auditing toolkit"
requires-python = ">=3.9"

[project.scripts]
relay-audit = "relay_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["relay_audit*"]

[tool.ruff]
target-version = "py39"
line-length = 160

[tool.ruff.lint]
ignore = ["BLE001", "TRY004"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
