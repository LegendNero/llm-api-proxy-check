name: relay-audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q relay_audit tests
      - run: python -m pip install ruff mypy
      - run: ruff check relay_audit tests
      - run: mypy relay_audit tests
      - run: python -m relay_audit demo --format json > relay-audit-report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: relay-audit-report
          path: relay-audit-report.json
