name: llm-api-proxy-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q llm_api_proxy_check tests
      - run: python -m pip install ruff mypy
      - run: ruff check llm_api_proxy_check tests
      - run: mypy llm_api_proxy_check tests
      - run: python -m llm_api_proxy_check demo --format json > llm-api-proxy-check-report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: llm-api-proxy-check-report
          path: llm-api-proxy-check-report.json
